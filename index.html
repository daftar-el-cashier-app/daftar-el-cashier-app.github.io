function customerError(){const d=db.draft,c=d.customer,app=['طلبات','منيوز'].includes(d.type);if(d.type!=='صالة'&&!/^\d{7,16}$/.test(phone(c.phone)))return 'اكتب رقم عميل صحيح من ٧ إلى ١٦ رقم.';if(d.type==='تيك أواي'&&!c.name.trim())return 'اسم عميل التيك أواي مطلوب.';if(app&&!d.appRef)return 'رقم الأوردر على التطبيق مطلوب.';if((d.type==='دليفري'||app&&d.ownDelivery)&&(!c.address.trim()||!c.area.trim()))return 'العنوان والمنطقة مطلوبين للتوصيل.';return ''}

te=e.target.value.trim());$('#productSearch').oninput=()=>{catTiles();products()};bindCustomer();$('#clearCart').onclick=()=>removeDraft(null);$('#discount').onclick=discountDialog;$('#printDraft').onclick=printDraft;$('#pay').onclick=payDialog;catTiles();products();cart()}

function receiptHTML(o,isDraft){const r={...RECEIPT_DEFAULTS,...db.receipt},qty=o.items.reduce((a,i)=>a+i.qty,0),settled=!isDraft&&typeof o.no==='number';let taxRow='';if(r.taxEnabled&&r.taxRate>0){const pre=Math.round(o.total*100/(100+r.taxRate));taxRow=`<div class="rc-row rc-sep"><span>Tax(${Number(r.taxRate).toFixed(1)}%) Incl.</span><bdi>${rcMoney(o.total-pre)}</bdi></div>`}return `<div class="rc" dir="ltr"><div class="rc-name">${esc(r.name)||'دفتر الكاشير'}</div>${r.subtitle?`<div class="rc-sub"><span>${esc(r.subtitle)}</span></div>`:''}${r.branch?`<div class="rc-branch">${esc(r.branch)}</div>`:''}${r.taxEnabled&&r.taxLabel?`<div class="rc-branch">${esc(r.taxLabel)}</div>`:''}<div class="rc-box">${settled?'Order# '+o.no+(o.voided?' - VOID':''):'DRAFT ORDER'}</div><div class="rc-row"><span>Printed At:</span><bdi>${rcDT(now())}</bdi></div><div class="rc-row rc-sep"><strong>${esc(o.type)}</strong>${settled?`<span>Check# ${o.no}</span>`:'<span>DRAFT</span>'}</div>${settled?`<div class="rc-row"><span>${esc(o.cashier||'')}</span><bdi>${rcDT(o.at)}</bdi></div>`:''}${o.customer&&(o.customer.name||o.customer.phone)?`<div class="rc-row"><span>${esc(o.customer.name)}</span><bdi dir="ltr">${esc(o.customer.phone)}</bdi></div>`:''}${o.customer&&(o.customer.area||o.customer.address)?`<div class="rc-rc">${esc([o.customer.area,o.customer.address].filter(Boolean).join(' - '))}</div>`:''}${o.appRef?`<div class="rc-rc">App Ref: ${esc(o.appRef)}</div>`:''}<table class="rc-table"><thead><tr><th>Qty</th><th>Item</th><th>Price</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${i.qty}</td><td>${esc(i.name)}</td><td><bdi>${rcMoney(i.qty*i.price)}</bdi></td></tr>`).join('')}</tbody></table>${o.discount?`<div class="rc-row rc-sep"><span>Discount</span><bdi>-${rcMoney(o.discount)}</bdi></div>`:''}${taxRow}<div class="rc-row rc-sep rc-total"><span>Total</span><bdi>${rcMoney(o.total)}</bdi></div>${settled?(o.cash?`<div class="rc-row"><span>Payment - Cash</span><bdi>${rcMoney(o.cash)}</bdi>< function payDialog(){const error=customerError();if(error){alert(error);return}if(!activeShift()){alert('افتح شيفت الأول.');return}modal(`<h2>تحصيل وتقفيل الأوردر</h2><p class="total">${money(total())}</p><form id="payForm"><label for="payMode">طريقة الدفع</label><select id="payMode"><option value="cash">كاش</option><option value="card">فيزا</option><option value="split">كاش + فيزا</option></select><div class="formgrid"><div><label for="cashPay">كاش بالجنيه</label><input id="cashPay" inputmode="decimal" required></div><div><label for="cardPay">فيزا بالجنيه</label><input id="cardPay" readonly></div><div><label for="cardType">نوع الفيزا</label><select id="cardType">${CARDS.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label for="terminalRef">مرجع ماكينة البنك (اختياري)</label><input id="terminalRef" maxlength="60"></div></div><p id="payError" class="error"></p><div class="actions"><button class="primary" id="confirmPay">تأكيد التحصيل</button><button type="button" id="cancelModal">رجوع</button></div></form>`);const set=()=>{const m=$('#payMode').value;$('#cashPay').value=m==='card'?'0.00':(total()/100).toFixed(2);$('#cashPay').readOnly=m!=='split';$('#cardPay').value=m==='card'?(total()/100).toFixed(2):'0.00';$('#cardType').disabled=m==='cash'};$('#payMode').onchange=set;$('#cashPay').oninput=()=>{const c=cents($('#cashPay').value);$('#cardPay').value=c!==null&&c<=total()?((total()-c)/100).toFixed(2):''};set();$('#cancelModal').onclick=closeModal;$('#payForm').onsubmit=e=>{e.preventDefault();const cash=cents($('#cashPay').value),card=cents($('#cardPay').value),t=total(),split=$('#payMode').value==='split';if(cash===null||card===null||cash+card!==t||split&&(!cash||!card)){$('#payError').textContent='الكاش والفيزا لازم يساووا الإجمالي.';return}const cardType=card?$('#cardType').value:null,terminalRef=$('#terminalRef').value.trim();let no;if(save(()=>{rememberCustomer();const d=db.draft;no=db.nextOrder++;const rate=db.commissions[d.type]||0;current().order function voidDialog(id){if(!isManager())return;const o=allOrders().find(o=>o.id===id),d=db.days.find(d=>d.orders.includes(o));if(d.status==='closed'||d.shifts.find(s=>s.id===o.shiftId)?.status==='closed'){alert('الشيفت أو اليوم مقفول. الإلغاء مقفول للحفاظ على تقرير التقفيل؛ عالج المرتجع محاسبيًا خارج النسخة.');return}modal(`<h2>إلغاء طلب ${o.no}</h2><p>الطلب مش هيتمسح. هيظهر ملغي، وقيمة ${money(o.total)} هتستبعد من المبيعات. المردود بنفس توزيع التحصيل: كاش ${money(o.cash)} وفيزا ${money(o.card)}. لازم تنفذ الرد الفعلي خارج البرنامج.</p><form id="voidForm"><label for="voidReason">سبب الإلغاء</label><input id="voidReason" required maxlength="160"><label for="voidPassword">أكد بباسورد يوزرك (${esc(user.username)})</label><input id="voidPassword" type="password" required><p id="voidError" class="error"></p><div class="actions"><button class="danger">تسجيل الإلغاء والمردود</button><button id="cancelModal" type="button">رجوع</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#voidForm').onsubmit=async e=>{e.preventDefault();const m=await authenticate(user.username,$('#voidPassword').value,'manager'),reason=$('#voidReason').value.trim();if(!m||!reason){$('#voidError').textContent='راجع الباسورد والسبب.';return}if(save(()=>{o.voided=true;o.voidAt=now();o.voidBy=user.username;o.voidReason=reason;log('إلغاء طلب ومردود',`طلب ${o.no} • ${money(o.total)} • ${reason}`)})){closeModal();render()}}}

function shiftOpenForm(){return `<form id="openShift" class="stack"><label for="shiftName">الشيفت المخطط</label><select id="shiftName">${db.schedule.map(s=>`<option value="${esc(s.name)}">${esc(s.name)} • ${esc(s.start)}</option>`).join('')}</select><label for="floatAmount">عهدة بداية الدرج بالجنيه</label><input id="floatAmount" type="number" min="0" step="0.01" required value="0"><button class="primary">فتح شيفت باسمي</button></form>`}

function shiftsView(v){v.innerHTML=`<section class="panel"><h2>شيفتات ${current().date}</h2>${current().shifts.map(s=>{const st=shiftStats(s);return `<div class="stockrow"><div class="row wraprow"><h3>${esc(s.cashier)} • ${esc(s.name)}</h3><span class="badge">${s.status==='open'?'مفتوح':'مقفول'}</span></div><p>من ${new Date(s.openedAt).toLocaleString('ar-EG')} • عهدة ${money(s.float)} • مبيعات كاش ${money(st.cash)}</p>${s.status==='closed'?`<div class="close-result">${s.variance<0?'شورت':s.variance>0?'أوفر':'متوازن'}: ${money(Math.abs(s.variance))}</div><p>المتوقع ${money(s.expected)} • المعدود ${money(s.actual)} • قفل ${esc(s.closedBy)}</p>`:`<p>المتوقع بالدرج ${money(st.expected)}</p><button class="primary" data-checkout="${s.id}">تشيك أوت الموظف</button>`}</div>`}).join('')||'<p class="empty">مفيش شيفتات مفتوحة لسه</p>'}</section>`;$$('[data-checkout]').forEach(b=>b.onclick=()=>checkoutDialog(b.dataset.checkout))}
function checkoutDialog(id){if(!isManager())return;const s=current().shifts.find(s=>s.id===id),st=shiftStats(s);if(db.draft.items.length){alert('خلّص أو فرّغ المسودة قبل تقفيل الشيفت.');return}modal(`<h2>تشيك أوت ${esc(s.cashier)}</h2><p>عهدة ${money(s.float)} + تحصيل كاش ${money(st.cash)} = متوقع ${money(st.expected)}</p><form id="checkoutForm"><label for="actualCash">الكاش المعدود فعليًا بالجنيه</label><input id="actualCash" type="number" required min="0" step="0.01"><label for="checkoutNote">ملاحظة الفرق</label><input id="checkoutNote" maxlength="160"><div id="variancePreview" class="close-result" style="margin:12px 0">سجل المبلغ الفعلي</div><div class="actions"><button class="primary">تأكيد التقفيل النهائي</button><button type="button" id="cancelModal">رجوع</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#actualCash').oninput=()=>{const a=cents($('#actualCash').value);$('#variancePreview').textContent=a===null?'راجع المبلغ':`${a<st.expected?'شورت':a>st.expected?'أوفر':'متوازن'}: ${money(Math.abs(a-st.expected))}`};$('#checkoutForm').onsubmit=e=>{e.preventDefault();const a=cents($('#actualCash').value),note=$('#checkoutNote').value.trim();if(a===null)return;if(save(()=>{Object.assign(s,{status:'closed',actual:a,expected:st.expected,variance:a-st.expected,closedAt:now(),closedBy:user.username,note});log('تشيك أوت موظف',`${s.cashier} • متوقع ${money(st.expected)} • فعلي ${money(a)} • فرق ${money(a-st.expected)}`)})){closeModal();render()}}}
function inventoryView(v){const d=current();v.innerHTML=`<section class="panel narrow"><h2>جرد الخامات اليومي</h2>${d.status==='closed'?'<p>اليوم مقفول. الجرد محفوظ في التقرير.</p>':`<form id="stockForm" class="formgrid"><div><label for="stockName">اسم الخامة</label><input id="stockName" required maxlength="60"></div><div><label for="stockUnit">الوحدة</label><input id="stockUnit" required maxlength="20"></div><div><label for="stockOpen">أول اليوم</label><input id="stockOpen" type="number" min="0" step="0.001" required></div><button class="primary" ${d.orders.length?'disabled':''}>إضافة خامة قبل أول طلب</button></form><form id="inventoryForm">${d.opening.map(s=>`<div class="stockrow"><h3>${esc(s.name)} (${esc(s.unit)})</h3><div class="formgrid"><div><label>أول اليوم</label><input data-opening="${s.id}" type="number" min="0" step="0.001" value="${s.opening}" ${d.orders.length?'readonly':''}></div><div><label>وارد اليوم</label><input data-incoming="${s.id}" type="number" min="0" step="0.001" required value="${d.inventory?.find(i=>i.id===s.id)?.incoming??''}"></div><div><label>الموجود آخر اليوم</label><input data-closing="${s.id}" type="number" min="0" step="0.001" required value="${d.inventory?.find(i=>i.id===s.id)?.closing??''}"></div></div></div>`).join('')||'<p>مفيش خامات، ممكن تحفظ جرد فارغ.</p>'}<button class="primary" style="margin-top:14px">حفظ الجرد</button></form>`}</section>`;if($('#stockForm'))$('#stockForm').onsubmit=e=>{e.preventDefault();const name=$('#stockName').value.trim(),unit=$('#stockUnit').value.trim(),opening=quantity($('#stockOpen').value);if(d.orders.length||!name||!unit||opening===null)return;if(save(()=>{d.opening.push({id:uid(),name,unit,opening});log('إضافة خامة',name)}))render()};if($('#inventoryForm'))$('#inventoryForm').onsubmit=e=>{e.preventDefault();let inv=d.opening.map(s=>{const opening=quantity($(`[data-opening="${s.id}"]`).value),incoming=quantity($(`[data-incoming="${s.id}"]`).value),closing=quantity($(`[data-closing="${s.id}"]`). const liveOrders=d=>d.orders.filter(o=>!o.voided);
function stats(d){return liveOrders(d).reduce((a,o)=>({cash:a.cash+o.cash,card:a.card+o.card,total:a.total+o.total,commission:a.commission+(o.commission||0)}),{cash:0,card:0,total:0,commission:0})}

function financeView(v){const d=db.days.find(x=>x.id===reportId)||current(),st=stats(d),costs=d.expenses.reduce((a,e)=>a+e.amount,0);v.innerHTML=`<section class="panel"><div class="noprint">${daySelect(d)}</div><h2>حسابات ${d.date}</h2><div class="stats"><div class="stat">صافي المبيعات<strong>${money(st.total)}</strong></div><div class="stat">عمولات التطبيقات<strong>${money(st.commission)}</strong></div><div class="stat">الصافي بعد العمولات<strong>${money(st.total-st.commission)}</strong></div><div class="stat">النتيجة بعد التكاليف المسجلة<strong>${money(st.total-st.commission-costs)}</strong></div></div><h3>عمولات التطبيقات</h3>${['طلبات','منيوز'].map(t=>{const os=liveOrders(d).filter(o=>o.type===t),sales=os.reduce((a,o)=>a+o.total,0),commission=os.reduce((a,o)=>a+o.commission,0);return `<div class="stockrow"><h3>${t}</h3><p>نسبة الطلبات المسجلة: ${[...new Set(os.map(o=>o.commissionRate+'%'))].join('، ')||'لا طلبات'} • نسبة الإعداد الحالية ${db.commissions[t]}%</p><p>مبيعات ${money(sales)} • عمولة ${money(commission)} • صافي بعد العمولة ${money(sales-commission)}</p></div>`}).join('')}<h3>تكاليف الفترة المسجلة</h3>${d.expenses.map(e=>`<p>${esc(e.label)} • ${money(e.amount)}</p>`).join('')||'<p class="muted">لم تسجل تكاليف. لا تعتبر النتيجة ربحًا.</p>'}${d.status==='open'?'<form id="expenseForm" class="formgrid"><div><label for="expenseLabel">وصف التكلفة</label><input id="expenseLabel" required maxlength="120"></div><div><label for="expenseAmount">القيمة بالجنيه</label><input id="expenseAmount" type="number" step="0.01" min="0.01" required></div><button class="primary">إضافة تكلفة محاسبية</button></form>':''}<h3>إعداد نسب العمولة</h3><form id="commissionForm" class="formgrid">${['طلبات','منيوز'].map((t,i)=>`<div><label for="rate${i}">${t} %</label><input id="rate${i}" type="number" min="0" max="100" step="0.01" required value="${db.commissions[t]}"></div>`).join('')}<button class="primary">حفظ للطلبات الجديدة فقط</button></form></section>`;$('#reportSelect').onchang function settingsView(v){v.innerHTML=`<div class="layout"><section class="panel"><h2>اليوزرات والصلاحيات</h2><form id="userForm" class="formgrid"><div><label for="newUsername">اسم المستخدم</label><input id="newUsername" required maxlength="40"></div><div><label for="newPassword">كلمة مرور جديدة (٦ حروف أو أكثر)</label><input id="newPassword" type="password" minlength="6" required autocomplete="new-password"></div><div><label for="newRole">الدور</label><select id="newRole">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="primary">إضافة يوزر</button><p id="userError" class="error wide"></p></form>${db.users.map(u=>`<div class="cartline"><div class="row wraprow"><span>${esc(u.username)} • ${ROLES[u.role]} • ${u.active?'نشط':'موقوف'}</span><div class="actions"><button data-reset="${u.id}">تغيير الباسورد</button>${u.id!==user.id?`<button data-toggle="${u.id}">${u.active?'إيقاف':'تفعيل'}</button>`:''}</div></div></div>`).join('')}<h3>مواعيد تغيير الشيفتات</h3><form id="scheduleForm"><label for="shiftCount">عدد الشيفتات</label><select id="shiftCount"><option ${db.schedule.length===2?'selected':''}>2</option><option ${db.schedule.length===3?'selected':''}>3</option></select>${[0,1,2].map(i=>`<div class="formgrid" data-schedule="${i}"><div><label>اسم شيفت ${i+1}</label><input id="sName${i}" value="${esc(db.schedule[i]?.name||'ليلي')}" maxlength="40"></div><div><label>وقت البداية</label><input id="sTime${i}" type="time" value="${db.schedule[i]?.start||'00:00'}"></div></div>`).join('')}<button class="primary" style="margin-top:12px">حفظ المواعيد</button></form></section><section class="panel"><h2>هوية المكان وشاشة الانتظار</h2><div class="stack">${(db.branding||{}).logo?`<img class="logoprev" alt="اللوجو الحالي" src="${db.branding.logo}">`:'<p class="muted">مفيش لوجو حاليًا.</p>'}<div><label for="logoFile">رفع لوجو (PNG أو JPG)</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></div>${(db.branding||{}).logo?'<button type="button" id="logoClear" class="danger">إزالة اللوجو</button>':''}<div><label for="idleMin">شاشة الانتظار بعد كام دقيقة (٠ = إيقاف)</label><input id="idleMin" type="number" min="0" max="120" step="1" value="${(db.branding||{}).idleMinutes??3}"></div><button type="button" id="brandSave" class="primary">حفظ</button></div></section><section class="panel"><h2>الإيصال المطبوع</h2><form id="receiptForm" class="formgrid"><div><label for="rcName">اسم المطعم على الإيصال</label><input id="rcName" maxlength="60" value="${esc((db.receipt||{}).name||'')}"></div><div><label for="rcSubtitle">سطر فرعي تحت الاسم (اختياري)</label><input id="rcSubtitle" maxlength="60" value="${esc((db.receipt||{}).subtitle||'')}"></div><div class="wide"><label for="rcBranch">الفرع / العنوان (اختياري)</label><input id="rcBranch" maxlength="120" value="${esc((db.receipt||{}).branch||'')}"></div><div class="checkrow wide"><input type="checkbox" id="rcTaxOn" ${(db.receipt||{}).taxEnabled?'checked':''}><label for="rcTaxOn">المطعم مسجل ضريبيًا: أظهر سطر الضريبة ووصف الفاتورة على الإيصال</label></div><div><label for="rcTaxRate">نسبة الضريبة %</label><input id="rcTaxRate" type="number" min="0" max="100" step="0.01" value="${(db.receipt||{}).taxRate??0}"></div><div><label for="rcTaxLabel">وصف أعلى الإيصال</label><input id="rcTaxLabel" maxlength="60" value="${esc((db.receipt||{}).taxLabel||'Simplified Tax Invoice')}"></div><button class="primary">حفظ إعدادات الإيصال</button></form></section></div>`;$('#userForm').onsubmit=async e=>{e.preventDefault();const name=$('#newUsername').value.trim(),p=$('#newPassword').value,role=$('#newRole').value;if(!name||db.users.some(u=>u.username===name)){$('#userError').textContent='اختار اسم مستخدم مختلف.';return}e.submitter.disabled=true;const u=await newUser(name,p,role);if(save(()=>{db.users.push(u);log('إضافة يوزر',`${name} • ${ROLES[role]}`)}))render()};$$('[data-toggle]').forEach(b=>b.onclick=()=>{save(()=>{const u=db.users.find(u=>u.id===b.dataset.toggle);u.active=!u.active;log('تغيير حالة يوزر',u.username+' • '+u.active)});render()});$$('[data-reset]').forEach(b=>b.onclick=()=>{const u=db.users.find(u=>u.id===b.dataset.reset);modal(`<h2>تغيير باسورد ${esc(u.username)}</h2><form id="resetPasswordForm"><label>باسورد جديد</label><input id="resetPassword" type="password" minlength="6" required autocomplete="new-password"><div class="actions"><button class="primary">حفظ</button><button type="button" id="cancelModal">رجوع</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#resetPasswordForm').onsubmit=async e=>{e.preventDefault();const n=await newUser(u.username,$('#resetPassword').value,u.role);if(save(()=>{u.hash=n.hash;u.salt=n.salt;log('تغيير باسورد',u.username)})){closeModal();toast('اتغير الباسورد')}}});const sched=()=>$$('[data-schedule]').forEach(e=>e.classList.toggle('hidden',Number(e.dataset.schedule)>=Number($('#shiftCount').value)));$('#shiftCount').onchange=sched;sched();$('#scheduleForm').onsubmit=e=>{e.preventDefault();const n=Number($('#shiftCount').value),s=Array.from({length:n},(_,i)=>({name:$('#sName'+i).value.trim(),start:$('#sTime'+i).value}));if(s.some(x=>!x.name||!x.start)||new Set(s.map(x=>x.name)).size!==n||new Set(s.map(x=>x.start)).size!==n){alert('كل شيفت محتاج اسم ووقت مختلفين.');return}if(save(()=>{db.schedule=s;log('تعديل مواعيد الشيفتات',s.map(x=>x.name+' '+x.start).join(' • '))}))toast('اتحفظ الجدول')};$('#receiptForm').onsubmit=e=>{e.preventDefault();const name=$('#rcName').value.trim(),subtitle=$('#rcSubtitle').value.trim(),branch=$('#rcBranch').value.trim(),taxEnabled=$('#rcTaxOn').checked,taxRate=Number($('#rcTaxRate').value),taxLabel=$('#rcTaxLabel').value.trim();if(!Number.isFinite(taxRate)||taxRate<0||taxRate>100){alert('نسبة الضريبة لازم تكون رقم بين ٠ و ١٠٠.');return}if(taxEnabled&&(!taxRate||!taxLabel)){alert('لتفعيل الضريبة اكتب النسبة ووصف الفاتورة.');return}if(save(()=>{db.receipt={name,subtitle,branch,taxEnabled,taxRate,taxLabel};log('إعدادات الإيصال',`${name||'بدون اسم'} • ضريبة ${taxEnabled?taxRate+'%':'مقفولة'}`)})){toast('اتحفظت إعدادات الإيصال');applyBrand()}};$('#logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('الصورة كبيرة. اختار أقل من ٥ ميجا.');return}logoFromFile(f,d=>{if(d.length>500000){alert('اللوجو كبير بعد التصغير. استخدم صورة أبسط.');return}if(save(()=>{db.branding.logo=d;log('تغيير اللوجو','')}))render()})};if($('#logoClear'))$('#logoClear').onclick=()=>{if(save(()=>{db.branding.logo='';log('إزالة اللوجو','')}))render()};$('#brandSave').onclick=()=>{const m=Number($('#idleMin').value);if(!Number.isInteger(m)||m<0||m>120){alert('اكتب رقم صحيح بين ٠ و ١٢٠.');return}if(save(()=>{db.branding.idleMinutes=m;log('شاشة الانتظار',m?m+' دقيقة':'متوقفة')}))toast('اتحفظ')};}

const canCatalog=()=>!!user&&['it','accountant'].includes(user.role),canMenu=()=>!!user&&['it','accountant','manager'].includes(user.role);

const liveCats=()=>db.categories.filter(c=>!c.deleted);
const stBadge=(on,a='مفعّل',b='موقوف')=>`<span class="st ${on?'on':'off'}">${on?a:b}</span>`;
const sw=(on,attr,id,label)=>`<button type="button" class="sw${on?' on':''}" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-${attr}="${id}"></button>`;
function tabsHTML(list,cur,attr){return `<div class="tbs" role="tablist">${list.map(([k,t,n])=>`<button type="button" role="tab" class="tb${cur===k?' on':''}" data-${attr}="${k}">${t} <small>${num(n)}</small></button>`).join('')}</div>`}
const catThumb=c=>`<span class="thumb" style="background-color:${c.color};color:${ink(c.color)};${phStyle(c.photo)}">${c.photo?'':esc(c.icon)}</span>`;
const itemThumb=i=>{const c=catOf(i.catId)||{color:'#147c80',icon:'🍽️'};return `<span class="thumb" style="${i.photo?phStyle(i.photo):'background-color:'+c.color+'33'}">${i.photo?'':esc(c.icon)}</span>`};
const photoSet=(kind,id,f)=>photoFromFile(f,d=>{if(save(()=>{const o=kind==='cat'?db.categories.find(c=>c.id===id):db.menu.find(i=>i.id===id);if(!photoOk(d))throw Error();o.photo=d;log('صورة '+(kind==='cat'?'تصنيف':'صنف'),o.name)})){toast('اتحفظت الصورة');render()}},kind==='cat'?300:256),photoDel=(kind,id)=>{if(save(()=>{const o=kind==='cat'?db.categories.find(c=>c.id===id):db.menu.find(i=>i.id===id);delete o.photo;log('شيل صورة',o.name)}))render()};
function bindPhotos(){$$('[data-catphoto]').forEach(el=>el.onchange=()=>el.files[0]&&photoSet('cat',el.dataset.catphoto,el.files[0]));$$('[data-itemphoto]').forEach(el=>el.onchange=()=>el.files[0]&&photoSet('item',el.dataset.itemphoto,el.files[0]));$$('[data-catphotodel]').forEach(b=>b.onclick=()=>photoDel('cat',b.dataset.catphotodel));$$('[data-itemphotodel]').forEach(b=>b.onclick=()=>photoDel('item',b.dataset.itemphotodel))}

function categoriesView(v){

function helpView(v){const admin=user?.role==='it';v.innerHTML=`<div class="layout"><section class="panel"><h2>التشغيل وحدود النسخة</h2><p>ملف HTML واحد بيشتغل بدون إنترنت. نزّله وافتحه بمتصفح حديث، مش عارض النصوص. لو واتساب حوّله TXT، غيّر الامتداد إلى HTML من الملفات أو من كمبيوتر الشغل. حافظ على نفس اسم ومكان الملف والمتصفح.</p><p>ابدأ بالتجربة: أي تي ينشئ يوزر لكل موظف ويظبط المنيو والشيفتات. المحاسب يضبط عمولات التطبيقات. الكاشير يفتح شيفت، يسجل العميل والطلب ويحصّل. المدير يوافق على الخصومات، يجرد، ويعمل تشيك أوت للموظف ويقفل اليوم.</p><p>لكل نوع فيزا ملخص مستقل، ومع أي مبلغ فيزا فيه مسلسل داخلي مستمر بين الأيام. ده مش مسلسل البنك. طابقه مع ماكينة الدفع وتسويات التطبيقات يدويًا.</p><p>الطباعة بتقفل الحذف للكاشير. بعد التحصيل المدير يقدر يلغي أوردر كامل مع تسجيل المردود والسبب، قبل قفل شيفته أو اليوم. مفيش حذف صامت، ولا مرتجع جزئي بعد التحصيل في النسخة دي. رد المال الحقيقي لازم يتم خارج البرنامج.</p><p>كل التكاليف والعمولات يدوية. الصافي بعد العمولة مش صافي الربح. النتيجة بعد التكاليف تقديرية وتتوقف على اكتمال التسجيل. لا ربط بطلبات أو منيوز أو البنك أو الطابعة الحرارية أو الضرائب، والطباعة من المتصفح فقط.</p><div class="warn">ده نموذج اختبار على جهاز واحد، مش POS إنتاجي معتمد. الصلاحيات وكلمات المرور تنظّم الاستخدام المحلي، لكنها لا تمنع شخصًا يقرأ الكود أو يعدّل التخزين. مفيش سيرفر أو مزامنة أو سجل مقاوم للتلاعب. لا تعتمد عليه وحده في شغل حقيقي أو تسلمه لعميل كنظام آمن.</div><p>بيانات العملاء والنسخ الاحتياطية غير مشفرة. حافظ على خصوصيتها، لا تشارك نسخة الشغل مع غير المصرح لهم. كلمات المرور مخزنة كقيم تحقق مملحة وليست كنص صريح.</p><p>اختبر الحفظ بعد القفل وإعادة الفتح والطباعة والنسخ على جهاز الشغل. التخزين المحلي قد يتغير حسب المتصفح، وممكن يتشال بمسح بيانات المتصفح أو التصفح الخفي. نزّل نسخة JSON كل يوم وانقلها لمكان آمن. استرجاع النسخة استبدال كامل مش دمج، وممكن يحتاج تسجيل دخول من جديد.</p></section><section class="panel stack"><h2>النسخ ووضع التشغيل</h2>${!user?'<button id="backLogin">رجوع للدخول</button>':''}<button id="switchMode">${mode==='demo'?'الانتقال لبيانات الشغل':'فتح وضع التجربة'}</button>${admin||!user&&loadProblem?'<button id="backup" class="primary">تنزيل نسخة احتياطية JSON</button>':'<p class="muted">التصدير الكامل والاسترجاع لأي تي فقط لحماية بيانات الحسابات والعملاء.</p>'}${admin?'<label for="restoreFile">استرجاع نسخة v2 أو نسخة v1 لنفس الوضع</label><input type="file" id="restoreFile" accept=".json,application/json"><button id="restore">استرجاع واستبدال البيانات</button><p class="muted">استيراد v1 يحتفظ بيوزرات v2 الحالية. العمولات القديمة تظل صفرًا لعدم وجودها في النسخة الأولى. صدّر نسخة قبل الاستيراد.</p>':''}</section></div>`;if($('#backLogin'))$('#backLogin').onclick=render;$('#switchMode').onclick=()=>{if(confirm('تبديل الوضع وتسجيل خروج؟ البيانات مش هتتمسح.')){try{localStorage.setItem(META,mode==='demo'?'real':'demo');location.reload()}catch(e){alert('التخزين غير متاح')}}};if($('#backup'))$('#backup').onclick=()=>{try{const raw=loadProblem?localStorage.getItem(KEY+mode):JSON.stringify(db,null,2);if(!raw){alert('مفيش بيانات محفوظة');return}download(raw,`دفتر-الكاشير-v2-${mode}-${today()}.json`,'application/json')}catch(e){alert('تعذر التصدير')}};if($('#restore'))$('#restore').onclick=async()=>{const f=$('#restoreFile').files[0];if(!f||f.size>20*1024*1024){alert('اختار نسخة JSON أقل من ٢٠ ميجابايت');return}try{let x=JSON.parse(await f.text());if(x.mode!==mode)throw Error();if(x.version===1)x=migrateV1(x);x=normalize(x);if(!validDB(x))throw Error();x.receipt={...RECEIPT_DEFAULTS,...x.receipt};if(!confirm('نزّلت نسخة حالية؟ كل بيانات الوضع الحالي هتتستبدل بالنسخة المختارة.'))return;localStorage.setItem(KEY+mode,JSON.stringify(x));location.reload()}catch(e){alert('تعذر الاسترجاع. الملف غير صالح أو لوضع تشغيل مختلف. لم يتم تغيير البيانات.')}}}
window.addEventListener('storage',e=>{if(e.key===KEY+mode||e.key===META){alert('البيانات اتغيرت من نافذة تانية، هنعيد التحميل لمنع تكرار العمليات.');location.reload()}});
