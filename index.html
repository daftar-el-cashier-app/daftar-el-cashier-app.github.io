function customerError(){const d=db.draft,c=d.customer,app=['طلبات','منيوز'].includes(d.type);if(d.type!=='صالة'&&!/^\d{7,16}$/.test(phone(c.phone)))return 'اكتب رقم عميل صحيح من ٧ إلى ١٦ رقم.';if(d.type==='تيك أواي'&&!c.name.trim())return 'اسم عميل التيك أواي مطلوب.';if(app&&!d.appRef)return 'رقم الأوردر على التطبيق مطلوب.';if((d.type==='دليفري'||app&&d.ownDelivery)&&(!c.address.trim()||!c.area.trim()))return 'العنوان والمنطقة مطلوبين للتوصيل.';return ''}
function activeShift(){return current().shifts.find(s=>s.status==='open'&&s.cashierId===user?.id)}

></section></div>`;$('#orderType').onchange=e=>{save(()=>db.draft.type=e.target.value);saleView(v)};$('#orderNote').onchange=e=>save(()=>db.draft.note=e.target.value.trim());$('#productSearch').oninput=()=>{catTiles();products()};bindCustomer();$('#clearCart').onclick=()=>removeDraft(null);$('#discount').onclick=discountDialog;$('#printDraft').onclick=printDraft;$('#pay').onclick=payDialog;catTiles();products();cart()}

function cart(){const d=db.draft;$('#cart').innerHTML=d.items.map(i=>`<div class="cartline"><div class="row"><div class="cartname"><strong>${esc(i.name)}</strong><div class="muted">${money(i.price)} × ${num(i.qty)}</div></div><bdi>${money(i.price*i.qty)}</bdi><div class="qty"><button data-inc="${i.id}">+</button><button data-dec="${i.id}">−</button></div></div></div>`).join('')||'<p class="empty">اختار صنف علشان تبدأ</p>';$('#cartTotal').textContent=money(total());$('#discountLabel').textContent=d.discount?'خصم '+money(d.discount)+' • '+d.approval.manager:'بدون خصم';$('#pay').disabled=!d.items.length||loadProblem;$('#printDraft').disabled=!d.items.length||loadProblem;$$('[data-inc]').forEach(b=>b.onclick=()=>{save(()=>{let i=d.items.find(i=>i.id===b.dataset.inc);if(i.qty>=999)throw Error();i.qty++;resetDiscount()});cart()});$$('[data-dec]').forEach(b=>b.onclick=()=>removeDraft(b.dataset.dec))}
function removeDraft(id){if(!can('sale')||!db.draft.items.length)return;if(db.draft.printedAt&&!isManager()){alert('بعد أمر الطباعة، الحذف بيوزر المدير فقط. بدّل اليوزر؛ المسودة هتفضل محفوظة.');return}if(!confirm(id?'تنقص قطعة من الصنف؟':'تفريغ كل أصناف المسودة؟'))return;let reason='تصحيح قبل الطباعة';if(isManager()){reason=prompt('سبب الحذف (بيتسجل باسمك)');if(!reason?.trim())return}if(save(()=>{log('حذف من مسودة',`مسودة ${db.draft.id} • ${id||'كل الأصناف'} • ${reason}`);if(id){let i=db.draft.items.find(i=>i.id===id);i.qty--;db.draft.items=db.draft.items.filter(i=>i.qty>0);resetDiscount()}else db.draft=blank()}))saleView($('#view'))}

function rememberCustomer(){const c=db.draft.customer;if(!c.phone)return;const existing=db.customers.find(x=>x.phone===phone(c.phone));if(existing)Object.assign(existing,c,{phone:phone(c.phone)});else db.customers.push({...c,phone:phone(c.phone)})}

function fmtDT(iso){return new Date(iso).toLocaleString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function rcDT(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(h)+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' '+ap}
function rcMoney(n){return 'EGP '+(n/100).toFixed(2)}
function qrText(o){const r={...RECEIPT_DEFAULTS,...db.receipt};return [r.name||'دفتر الكاشير','Order# '+o.no,'Date: '+rcDT(o.at),'Total: EGP '+(o.total/100).toFixed(2),'Payment: '+[o.cash?'Cash '+(o.cash/100).toFixed(2):'',o.card?'Card '+(o.card/100).toFixed(2):''].filter(Boolean).join(' + ')].join('\n')}

function receiptHTML(o,isDraft){const r={...RECEIPT_DEFAULTS,...db.receipt},qty=o.items.reduce((a,i)=>a+i.qty,0),settled=!isDraft&&typeof o.no==='number';let taxRow='';if(r.taxEnabled&&r.taxRate>0){const pre=Math.round(o.total*100/(100+r.taxRate));taxRow=`<div class="rc-row rc-sep"><span>Tax(${Number(r.taxRate).toFixed(1)}%) Incl.</span><bdi>${rcMoney(o.total-pre)}</bdi></div>`}return `<div class="rc" dir="ltr"><div class="rc-name">${esc(r.name)||'دفتر الكاشير'}</div>${r.subtitle?`<div class="rc-sub"><span>${esc(r.subtitle)}</span></div>`:''}${r.branch?`<div class="rc-branch">${esc(r.branch)}</div>`:''}${r.taxEnabled&&r.taxLabel?`<div class="rc-branch">${esc(r.taxLabel)}</div>`:''}<div class="rc-box">${settled?'Order# '+o.no+(o.voided?' - VOID':''):'DRAFT ORDER'}</div><div class="rc-row"><span>Printed At:</span><bdi>${rcDT(now())}</bdi></div><div class="rc-row rc-sep"><strong>${esc(o.type)}</strong>${settled?`<span>Check# ${o.no}</span>`:'<span>DRAFT</span>'}</div>${settled?`<div class="rc-row"><span>${esc(o.cashier||'')}</span><bdi>${rcDT(o.at)}</bdi></div>`:''}${o.customer&&(o.customer.name||o.customer.phone)?`<div class="rc-row"><span>${esc(o.customer.name)}</span><bdi dir="ltr">${esc(o.customer.phone)}</bdi></div>`:''}${o.customer&&(o.customer.area||o.customer.address)?`<div class="rc-rc">${esc([o.customer.area,o.customer.address].filter(Boolean).join(' - '))}</div>`:''}${o.appRef?`<div class="rc-rc">App Ref: ${esc(o.appRef)}</div>`:''}<table class="rc-table"><thead><tr><th>Qty</th><th>Item</th><th>Price</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${i.qty}</td><td>${esc(i.name)}</td><td><bdi>${rcMoney(i.qty*i.price)}</bdi></td></tr>`).join('')}</tbody></table>${o.discount?`<div class="rc-row rc-sep"><span>Discount${o.approval?.manager?' - Approved by '+esc(o.approval.manager):''}</span><bdi>-${rcMoney(o.discount)}</bdi></div>`:''}${taxRow}<div class="rc-row rc-sep rc-total"><span>Total</span><bdi>${rcMoney(o.total)}</bdi></div>${settled?(o.cash?`<div class function payDialog(){const error=customerError();if(error){alert(error);return}if(!activeShift()){alert('افتح شيفت الأول.');return}modal(`<h2>تحصيل وتقفيل الأوردر</h2><p class="total">${money(total())}</p><form id="payForm"><label for="payMode">طريقة الدفع</label><select id="payMode"><option value="cash">كاش</option><option value="card">فيزا</option><option value="split">كاش + فيزا</option></select><div class="formgrid"><div><label for="cashPay">كاش بالجنيه</label><input id="cashPay" inputmode="decimal" required></div><div><label for="cardPay">فيزا بالجنيه</label><input id="cardPay" readonly></div><div><label for="cardType">نوع الفيزا</label><select id="cardType">${CARDS.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label for="terminalRef">مرجع ماكينة البنك (اختياري)</label><input id="terminalRef" maxlength="60"></div></div><p class="muted">ده تسجيل للتحصيل، مش خصم فعلي من بطاقة. المبلغ المقسم لازم يكون فيه كاش وفيزا.</p><p id="payError" class="error"></p><div class="actions"><button class="primary" id="confirmPay">تأكيد التحصيل</button><button type="button" id="cancelModal">رجوع</button></div></form>`);const set=()=>{const m=$('#payMode').value;$('#cashPay').value=m==='card'?'0.00':(total()/100).toFixed(2);$('#cashPay').readOnly=m!=='split';$('#cardPay').value=m==='card'?(total()/100).toFixed(2):'0.00';$('#cardType').disabled=m==='cash'};$('#payMode').onchange=set;$('#cashPay').oninput=()=>{const c=cents($('#cashPay').value);$('#cardPay').value=c!==null&&c<=total()?((total()-c)/100).toFixed(2):''};set();$('#cancelModal').onclick=closeModal;$('#payForm').onsubmit=e=>{e.preventDefault();const cash=cents($('#cashPay').value),card=cents($('#cardPay').value),t=total(),split=$('#payMode').value==='split';if(cash===null||card===null||cash+card!==t||split&&(!cash||!card)){$('#payError').textContent='الكاش والفيزا لازم يساووا الإجمالي.';return}const cardType=card?$('#cardType').value:null,terminalRef=$('#terminalRef').value.trim();let no;if(save(()=>{remembe function orderCard(o,actions=false){return `<article class="reportorder"><div class="row wraprow"><strong>طلب ${num(o.no)} • ${esc(o.type)} ${o.voided?'• ملغي':''}</strong><bdi class="price">${money(o.total)}</bdi></div><p class="muted compact">${new Date(o.at).toLocaleString('ar-EG')} • ${esc(o.cashier||'نسخة ١')}${o.visa?' • مسلسل فيزا '+num(o.visa):''}</p><p>${esc(o.customer?.name)} ${esc(o.customer?.phone)} ${o.appRef?'• رقم التطبيق '+esc(o.appRef):''}</p><p>${esc(o.customer?.area)} ${esc(o.customer?.address)}</p><p>${o.items.map(i=>`${num(i.qty)} × ${esc(i.name)}`).join('، ')}</p><p>كاش: ${money(o.cash)} • ${esc(o.cardType||'فيزا')}: ${money(o.card)}</p>${o.discount?`<p>خصم ${money(o.discount)} • اعتماد ${esc(o.approval?.manager||'')}</p>`:''}${o.note?`<p>${esc(o.note)}</p>`:''}${o.voided?`<p class="danger">إلغاء بواسطة ${esc(o.voidBy)} • ${esc(o.voidReason)}. المردود المسجل: كاش ${money(o.cash)} / ${esc(o.cardType||'فيزا')} ${money(o.card)}. تنفيذ الرد فعليًا يدوي.</p>`:''}${actions?`<div class="actions noprint"><button data-receipt="${o.id}">إيصال</button>${isManager()&&!o.voided?`<button class="danger" data-void="${o.id}">إلغاء بتحقق المدير</button>`:''}</div>`:''}</article>`}
function bindOrderActions(){ $$('[data-receipt]').forEach(b=>b.onclick=()=>{const o=allOrders().find(o=>o.id===b.dataset.receipt);modal(receiptHTML(o,false)+`<div class="actions noprint"><button id="doPrint">طباعة</button><button id="cancelModal">رجوع</button></div>`);$('#doPrint').onclick=printModal;$('#cancelModal').onclick=closeModal});$$('[data-void]').forEach(b=>b.onclick=()=>voidDialog(b.dataset.void))}
function ordersView(v){v.innerHTML=`<section class="panel"><h2>طلبات اليوم</h2><p class="muted">بعد التحصيل مفيش حذف للكاشير. المدير يقدر يلغي الأوردر كامل مع سبب وسجل مردود. لا يتم محو السجل الأصلي.</p>${current().orders.slice().reverse().map(o=>orderCard(o,true)).join('')||'<p class="empty">لسه مفيش طلبات</p>'}</section>`;bindOrderActions()}
function voidDialog(id){if(!isManager())return;const o=allOrders().find(o=>o.id===id),d=db.days.find(d=>d.orders.includes(o));if(d.status==='closed'||d.shifts.find(s=>s.id===o.shiftId)?.status==='closed'){alert('الشيفت أو اليوم مقفول. الإلغاء مقفول للحفاظ على تقرير التقفيل؛ عالج المرتجع محاسبيًا خارج النسخة.');return}modal(`<h2>إلغاء طلب ${o.no}</h2><p>الطلب مش هيتمسح. هيظهر ملغي، وقيمة ${money(o.total)} هتستبعد من المبيعات. المردود بنفس توزيع التحصيل: كاش ${money(o.cash)} وفيزا ${money(o.card)}. لازم تنفذ الرد الفعلي خارج البرنامج.</p><form id="voidForm"><label for="voidReason">سبب الإلغاء</label><input id="voidReason" required maxlength="160"><label for="voidPassword">أكد بباسورد يوزرك (${esc(user.username)})</label><input id="voidPassword" type="password" required><p id="voidError" class="error"></p><div class="actions"><button class="danger">تسجيل الإلغاء والمردود</button><button id="cancelModal" type="button">رجوع</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#voidForm').onsubmit=async e=>{e.preventDefault();const m=await authenticate(user.username,$('#voidPassword').value,'manager'),reason=$('#voidReason').value.trim();if(!m||!reason){$('#voidError').textContent='راجع الباسورد والسبب.';return}if(save(()=>{o.voided=true;o.voidAt=now();o.voidBy=user.username;o.voidReason=reason;log('إلغاء طلب ومردود',`طلب ${o.no} • ${money(o.total)} • ${reason}`)})){closeModal();render()}}}
function customersView(v){v.innerHTML='<section class="panel"><h2>قاعدة العملاء الموحدة</h2><p class="muted">ابحث برقم العميل لعرض طلباته في كل الأيام وكل القنوات. متاحة للكاشير من غير يوزر مدير.</p><label for="customerSearch">رقم العميل</label><input id="customerSearch" type="search" inputmode="tel" placeholder="رقم كامل أو جزء منه"><div id="customerResults"></div></section>';const search=()=>{const q=phone($('#customerSearch').value);if(!q){$('#customerResults').innerHTML='<p class="empty">اكتب رقم العميل</p>';return}const cs=db.customers.filter(c=>c.phone.includes(q));$('#customerResults').innerHTML=cs.map(c=>{const os=allOrders().filter(o=>phone(o.customer?.phone||'')===c.phone);return `<section class="stockrow"><h3>${esc(c.name||'عميل')} • <bdi>${esc(c.phone)}</bdi></h3><p>${esc(c.area)} • ${esc(c.address)}</p><span class="badge">${num(os.length)} طلب بكل القنوات</span>${os.slice().reverse().map(o=>orderCard(o,true)).join('')}</section>`}).join('')||'<p class="empty">الرقم مش متسجل</p>';bindOrderActions()};$('#customerSearch').oninput=search;search()}
function shiftOpenForm(){return `<form id="openShift" class="stack"><label for="shiftName">الشيفت المخطط</label><select id="shiftName">${db.schedule.map(s=>`<option value="${esc(s.name)}">${esc(s.name)} • ${esc(s.start)}</option>`).join('')}</select><label for="floatAmount">عهدة بداية الدرج بالجنيه</label><input id="floatAmount" type="number" min="0" step="0.01" required value="0"><button class="primary">فتح شيفت باسمي</button></form>`}
function bindShiftOpen(){if(!$('#openShift'))return;$('#openShift').onsubmit=e=>{e.preventDefault();const amount=cents($('#floatAmount').value),name=$('#shiftName').value;if(amount===null||current().status!=='open'||activeShift())return;if(save(()=>{current().shifts.push({id:uid(),cashierId:user.id,cashier:user.username,name,openedAt:now(),float:amount,status:'open'});log('فتح شيفت',`${user.username} • ${name} • عهدة ${money(amount)}`)}))render()}}
function shiftStats(s){const orders=current().orders.filter(o=>o.shiftId===s.id&&!o.voided);const cash=orders.reduce((a,o)=>a+o.cash,0);return {cash,expected:s.float+cash,orders:orders.length}}
function shiftsView(v){v.innerHTML=`<section class="panel"><h2>شيفتات ${current().date}</h2><p class="muted">كل كاشير يفتح شيفته بعهدة، والمدير يعدّ الكاش الفعلي ويعمل تشيك أوت. الفيزا مش داخلة في درج الكاش. النسخة لا تدعم سحب أو إيداع نقدية أثناء الشيفت؛ سجّل مصروفات التشغيل محاسبيًا من شاشة الحسابات فقط.</p>${current().shifts.map(s=>{const st=shiftStats(s);return `<div class="stockrow"><div class="row wraprow"><h3>${esc(s.cashier)} • ${esc(s.name)}</h3><span class="badge">${s.status==='open'?'مفتوح':'مقفول'}</span></div><p>من ${new Date(s.openedAt).toLocaleString('ar-EG')} • عهدة ${money(s.float)} • مبيعات كاش ${money(st.cash)}</p>${s.status==='closed'?`<div class="close-result">${s.variance<0?'شورت':s.variance>0?'أوفر':'متوازن'}: ${money(Math.abs(s.variance))}</div><p>المتوقع ${money(s.expected)} • المعدود ${money(s.actual)} • قفل ${esc(s.closedBy)}</p>`:`<p>المتوقع بالدرج ${money(st.expected)}</p><button class="primary" data-checkout="${s.id}">تشيك أوت الموظف</button>`}</div>`}).join('')||'<p class="empty">مفيش شيفتات مفتوحة لسه</p>'}</section>`;$$('[data-checkout]').forEach(b=>b.onclick=()=>checkoutDialog(b.dataset.checkout))}
function checkoutDialog(id){if(!isManager())return;const s=current().shifts.find(s=>s.id===id),st=shiftStats(s);if(db.draft.items.length){alert('خلّص أو فرّغ المسودة قبل تقفيل الشيفت.');return}modal(`<h2>تشيك أوت ${esc(s.cashier)}</h2><p>عهدة ${money(s.float)} + تحصيل كاش ${money(st.cash)} = متوقع ${money(st.expected)}</p><form id="checkoutForm"><label for="actualCash">الكاش المعدود فعليًا بالجنيه</label><input id="actualCash" type="number" required min="0" step="0.01"><label for="checkoutNote">ملاحظة الفرق</label><input id="checkoutNote" maxlength="160"><div id="variancePreview" class="close-result" style="margin:12px 0">سجل المبلغ الفعلي</div><div class="actions"><button class="primary">تأكيد التقفيل النهائي</button><button type="button" id="cancelModal">رجوع</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#actualCash').oninput=()=>{const a=cents($('#actualCash').value);$('#variancePreview').textContent=a===null?'راجع المبلغ':`${a<st.expected?'شورت':a>st.expected?'أوفر':'متوازن'}: ${money(Math.abs(a-st.expected))}`};$('#checkoutForm').onsubmit=e=>{e.preventDefault();const a=cents($('#actualCash').value),note=$('#checkoutNote').value.trim();if(a===null)return;if(save(()=>{Object.assign(s,{status:'closed',actual:a,expected:st.expected,variance:a-st.expected,closedAt:now(),closedBy:user.username,note});log('تشيك أوت موظف',`${s.cashier} • متوقع ${money(st.expected)} • فعلي ${money(a)} • فرق ${money(a-st.expected)}`)})){closeModal();render()}}}
function inventoryView(v){const d=current();v.innerHTML=`<section class="panel narrow"><h2>جرد الخامات اليومي</h2><p class="muted">جرد يدوي مستقل عن أصناف البيع. الاستهلاك = أول + وارد − آخر، ويشمل الهالك والفروق. مفيش خصم وصفات آلي.</p>${d.status==='closed'?'<p>اليوم مقفول. الجرد محفوظ في التقرير.</p>':`<form id="stockForm" class="formgrid"><div><label for="stockName">اسم الخامة</label><input id="stockName" required maxlength="60"></div><div><label for="stockUnit">الوحدة</label><input id="stockUnit" required maxlength="20"></div><div><label for="stockOpen">أول اليوم</label><input id="stockOpen" type="number" min="0" step="0.001" required></div><button class="primary" ${d.orders.length?'disabled':''}>إضافة خامة قبل أول طلب</button></form><form id="inventoryForm">${d.opening.map(s=>`<div class="stockrow"><h3>${esc(s.name)} (${esc(s.unit)})</h3><div class="formgrid"><div><label>أول اليوم</label><input data-opening="${s.id}" type="number" min="0" step="0.001" value="${s.opening}" ${d.orders.length?'readonly':''}></div><div><label>وارد اليوم</label><input data-incoming="${s.id}" type="number" min="0" step="0.001" required value="${d.inventory?.find(i=>i.id===s.id)?.incoming??''}"></div><div><label>الموجود آخر اليوم</label><input data-closing="${s.id}" type="number" min="0" step="0.001" required value="${d.inventory?.find(i=>i.id===s.id)?.closing??''}"></div></div></div>`).join('')||'<p>مفيش خامات، ممكن تحفظ جرد فارغ.</p>'}<button class="primary" style="margin-top:14px">حفظ الجرد</button></form>`}</section>`;if($('#stockForm'))$('#stockForm').onsubmit=e=>{e.preventDefault();const name=$('#stockName').value.trim(),unit=$('#stockUnit').value.trim(),opening=quantity($('#stockOpen').value);if(d.orders.length||!name||!unit||opening===null)return;if(save(()=>{d.opening.push({id:uid(),name,unit,opening});log('إضافة خامة',name)}))render()};if($('#inventoryForm'))$('#inventoryForm').onsubmit=e=>{e.preventDefault();let inv=d.opening.map(s=>{const opening=quantity($(`[data-opening="${s.id}"]`).value),incoming=quantity($(`[data-incoming="${s.id}"]`).value),closing=quantity($(`[data-closing="${s.id}"]`).value);return {...s,opening,incoming,closing,used:Math.round((opening+incoming-closing)*1000)/1000}});if(inv.some(i=>[i.opening,i.incoming,i.closing].some(n=>n===null))){alert('راجع كميات الجرد');return}if(inv.some(i=>i.used<0)&&!confirm('في رصيد آخر أكبر من المتاح. تسجل فرق الزيادة؟'))return;if(save(()=>{d.inventory=inv;d.opening=inv.map(({id,name,unit,opening})=>({id,name,unit,opening}));log('حفظ الجرد',d.date)}))toast('اتحفظ الجرد. التقفيل النهائي من التقارير.') }}
const liveOrders=d=>d.orders.filter(o=>!o.voided);
function stats(d){return liveOrders(d).reduce((a,o)=>({cash:a.cash+o.cash,card:a.card+o.card,total:a.total+o.total,commission:a.commission+(o.commission||0)}),{cash:0,card:0,total:0,commission:0})}
function daySelect(d){return `<label for="reportSelect">اليوم / الأرشيف</label><select id="reportSelect">${db.days.slice().reverse().map(x=>`<option value="${x.id}" ${d.id===x.id?'selected':''}>${x.date} • ${x.status==='closed'?'مقفول':'مفتوح'}</option>`).join('')}</select>`}
function reportContent(d){const st=stats(d),os=liveOrders(d);return `<h2>تقرير يوم ${d.date}</h2><p class="muted">${d.status==='closed'?'تقفيل نهائي':'تقرير مبدئي'} • ${mode==='demo'?'تجربة':'بيانات الشغل'}</p><div class="stats"><div class="stat">كاش<strong>${money(st.cash)}</strong></div><div class="stat">فيزا<strong>${money(st.card)}</strong></div><div class="stat">صافي المبيعات بعد الخصم والإلغاء<strong>${money(st.total)}</strong></div></div><h3>تفصيل طرق الدفع</h3>${CARDS.map(t=>`<div class="cartline row"><span>${t}</span><bdi>${money(os.filter(o=>o.cardType===t).reduce((a,o)=>a+o.card,0))}</bdi></div>`).join('')}<h3>حسب قناة الطلب</h3>${TYPES.map(t=>{const a=os.filter(o=>o.type===t);return `<div class="stockrow"><strong>${t} • ${num(a.length)} طلب</strong><p>كاش ${money(a.reduce((s,o)=>s+o.cash,0))} • فيزا ${money(a.reduce((s,o)=>s+o.card,0))}</p></div>`}).join('')}<h3>تسلسل الفيزا الداخلي</h3>${d.orders.filter(o=>o.card).map(o=>`<p>مسلسل ${num(o.visa)} • طلب ${num(o.no)} • ${esc(o.cardType||'فيزا أخرى')} • ${money(o.card)} ${o.voided?'• ملغي':''} ${o.terminalRef?'• مرجع '+esc(o.terminalRef):''}</p>`).join('')||'<p>مفيش عمليات فيزا</p>'}<h3>تقفيل الموظفين</h3>${d.shifts.map(s=>`<div class="stockrow">${esc(s.cashier)} • ${esc(s.name)} • ${s.status==='closed'?`${s.variance<0?'شورت':s.variance>0?'أوفر':'متوازن'} ${money(Math.abs(s.variance))} • فعلي ${money(s.actual)} • متوقع ${money(s.expected)}`:'شيفت مفتوح'}</div>`).join('')||'<p>مفيش شيفتات</p>'}<h3>الجرد والاستهلاك</h3>${d.inventory?d.inventory.map(s=>`<div class="stockrow"><strong>${esc(s.name)} (${esc(s.unit)})</strong><p>أول ${num(s.opening)} + وارد ${num(s.incoming)} − آخر ${num(s.closing)} = استهلاك / فرق ${num(s.used)}</p></div>`).join('')||'<p>جرد فارغ</p>':'<p>لم يتم حفظ الجرد</p>'}<h3>تفاصيل الطلبات (${num(d.orders.length)})</h3>${d.orders.map(o=>orderCard(o,false)).join('')}`}
function reportsView(v){let d=db.days.find(x=>x.id===reportId)||current();v.innerHTML=`<section class="panel noprint"><div class="row wraprow"><div>${daySelect(d)}</div><div class="actions"><button id="downloadReport">تنزيل تقرير نص</button><button id="printReport">طباعة / PDF</button>${isManager()?(current().status==='open'?'<button class="primary" id="closeDay">تقفيل اليوم</button>':'<button class="primary" id="newDay">فتح يوم جديد</button>'):''}</div></div></section><section class="panel" id="printable" style="margin-top:16px">${reportContent(d)}</section>`;$('#reportSelect').onchange=e=>{reportId=e.target.value;render()};$('#downloadReport').onclick=()=>download('\uFEFF'+$('#printable').innerText,`تقرير-${d.date}.txt`,'text/plain;charset=utf-8');$('#printReport').onclick=()=>window.print();if($('#closeDay'))$('#closeDay').onclick=()=>{if(db.draft.items.length){alert('خلّص أو فرّغ المسودة الأول.');return}if(current().shifts.some(s=>s.status==='open')){alert('اعمل تشيك أوت لكل الشيفتات الأول.');return}if(!current().inventory){alert('احفظ الجرد الأول، حتى لو فارغ.');go('inventory');return}if(confirm('تقفيل نهائي لليوم؟ بعدها مفيش حذف أو تعديل، والأرشيف هيفضل محفوظ.')){if(save(()=>{current().status='closed';current().closedAt=now();log('تقفيل يوم',current().date)}))render()}};if($('#newDay'))$('#newDay').onclick=()=>{const date=prompt('تاريخ اليوم الجديد YYYY-MM-DD',today());if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<=current().date||!Number.isFinite(new Date(date).getTime())||new Date(date).toISOString().slice(0,10)!==date){alert('اختار تاريخ صحيح بعد اليوم المقفول.');return}if(save(()=>{const d=day();d.date=date;d.opening=(current().inventory||[]).map(s=>({id:s.id,name:s.name,unit:s.unit,opening:s.closing}));db.days.push(d);log('فتح يوم',date)})){reportId=null;render()}}}
function financeView(v){const d=db.days.find(x=>x.id===reportId)||current(),st=stats(d),costs=d.expenses.reduce((a,e)=>a+e.amount,0);v.innerHTML=`<section class="panel"><div class="noprint">${daySelect(d)}</div><h2>حسابات ${d.date}</h2><div class="stats"><div class="stat">صافي المبيعات<strong>${money(st.total)}</strong></div><div class="stat">عمولات التطبيقات<strong>${money(st.commission)}</strong></div><div class="stat">الصافي بعد العمولات<strong>${money(st.total-st.commission)}</strong></div><div class="stat">النتيجة بعد التكاليف المسجلة<strong>${money(st.total-st.commission-costs)}</strong></div></div><div class="warn">دي نتيجة تقديرية، مش صافي ربح كامل إلا لو سجلت كل التكاليف للفترة: خامات مستهلكة وأجور وإيجار ومصروفات وضرائب. الجرد كميات فقط ومش بيتحول لتكلفة تلقائيًا. مصروفات الشاشة لا تخصم من درج الشيفت.</div><h3>عمولات التطبيقات</h3><p class="muted">النسبة بتتثبت لكل أوردر وقت التحصيل. تغيير الإعدادات مش بيغير الأوردرات القديمة. مفيش مزامنة أو تسوية آلية مع التطبيقات.</p>${['طلبات','منيوز'].map(t=>{const os=liveOrders(d).filter(o=>o.type===t),sales=os.reduce((a,o)=>a+o.total,0),commission=os.reduce((a,o)=>a+o.commission,0);return `<div class="stockrow"><h3>${t}</h3><p>نسبة الطلبات المسجلة: ${[...new Set(os.map(o=>o.commissionRate+'%'))].join('، ')||'لا طلبات'} • نسبة الإعداد الحالية ${db.commissions[t]}%</p><p>مبيعات ${money(sales)} • عمولة ${money(commission)} • صافي بعد العمولة ${money(sales-commission)}</p></div>`}).join('')}<h3>تكاليف الفترة المسجلة</h3>${d.expenses.map(e=>`<p>${esc(e.label)} • ${money(e.amount)}</p>`).join('')||'<p class="muted">لم تسجل تكاليف. لا تعتبر النتيجة ربحًا.</p>'}${d.status==='open'?'<form id="expenseForm" class="formgrid"><div><label for="expenseLabel">وصف التكلفة</label><input id="expenseLabel" required maxlength="120"></div><div><label for="expenseAmount">القيمة بالجنيه</label><input id="expenseAmount" type="number" step="0.01" min="0.01" required></div><button class="primary">إضافة تكلفة محاسبية</button></form>':''}<h3>إعداد نسب العمولة</h3><form id="commissionForm" class="formgrid">${['طلبات','منيوز'].map((t,i)=>`<div><label for="rate${i}">${t} %</label><input id="rate${i}" type="number" min="0" max="100" step="0.01" required value="${db.commissions[t]}"></div>`).join('')}<button class="primary">حفظ للطلبات الجديدة فقط</button></form></section>`;$('#reportSelect').onchange=e=>{reportId=e.target.value;render()};$('#commissionForm').onsubmit=e=>{e.preventDefault();const a=Number($('#rate0').value),b=Number($('#rate1').value);if([a,b].some(n=>!Number.isFinite(n)||n<0||n>100))return;if(save(()=>{db.commissions={'طلبات':a,'منيوز':b};log('تغيير نسب العمولة',`طلبات ${a}% • منيوز ${b}%`)}))toast('اتحفظت النسب للطلبات الجديدة')};if($('#expenseForm'))$('#expenseForm').onsubmit=e=>{e.preventDefault();const label=$('#expenseLabel').value.trim(),amount=cents($('#expenseAmount').value);if(!label||!amount)return;if(save(()=>{d.expenses.push({id:uid(),label,amount,at:now(),by:user.username});log('تكلفة محاسبية',`${label} • ${money(amount)}`)}))render()}}
function settingsView(v){v.innerHTML=`<div class="layout"><section class="panel"><h2>اليوزرات والصلاحيات</h2><p class="muted">دور ثابت لكل يوزر: كاشير للبيع والعملاء، مدير للجرد والتقارير والخصومات والتقفيل، محاسب للحسابات، أي تي لليوزرات والإعدادات، والمنيو من صفحة التصنيفات والأصناف. أنشئ على الأقل مدير وكاشير ومحاسب قبل التشغيل.</p><form id="userForm" class="formgrid"><div><label for="newUsername">اسم المستخدم</label><input id="newUsername" required maxlength="40"></div><div><label for="newPassword">كلمة مرور جديدة (٦ حروف أو أكثر)</label><input id="newPassword" type="password" minlength="6" required autocomplete="new-password"></div><div><label for="newRole">الدور</label><select id="newRole">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="primary">إضافة يوزر</button><p id="userError" class="error wide"></p></form>${db.users.map(u=>`<div class="cartline"><div class="row wraprow"><span>${esc(u.username)} • ${ROLES[u.role]} • ${u.active?'نشط':'موقوف'}</span><div class="actions"><button data-reset="${u.id}">تغيير الباسورد</button>${u.id!==user.id?`<button data-toggle="${u.id}">${u.active?'إيقاف':'تفعيل'}</button>`:''}</div></div></div>`).join('')}<h3>مواعيد تغيير الشيفتات</h3><p class="muted">جدول مخطط من شيفتين أو ٣. بداية ونهاية العمل الفعلية بتتسجل عند فتح وتقفيل كل موظف.</p><form id="scheduleForm"><label for="shiftCount">عدد الشيفتات</label><select id="shiftCount"><option ${db.schedule.length===2?'selected':''}>2</option><option ${db.schedule.length===3?'selected':''}>3</option></select>${[0,1,2].map(i=>`<div class="formgrid" data-schedule="${i}"><div><label>اسم شيفت ${i+1}</label><input id="sName${i}" value="${esc(db.schedule[i]?.name||'ليلي')}" maxlength="40"></div><div><label>وقت البداية</label><input id="sTime${i}" type="time" value="${db.schedule[i]?.start||'00:00'}"></div></div>`).join('')}<button class="primary" style="margin-top:12px">حفظ المواعيد</button></form></section><section class="panel"><h2>هوية المكان وشاشة الانتظار</h2><p class="muted">اسم المكان بياخد من خانة «اسم المطعم على الإيصال» تحت. اللوجو بيتخزن على الجهاز ده فقط. لو مفيش لوجو بيظهر الاسم لوحده. الاسم واللوجو بيظهروا بشكل خفيف في خلفية النظام، وبعد فترة عدم استخدام بتظهر شاشة متحركة، وأي لمسة أو زر بيرجّعك لنفس المكان.</p><div class="stack">${(db.branding||{}).logo?`<img class="logoprev" alt="اللوجو الحالي" src="${db.branding.logo}">`:'<p class="muted">مفيش لوجو حاليًا.</p>'}<div><label for="logoFile">رفع لوجو (PNG أو JPG)</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"></div>${(db.branding||{}).logo?'<button type="button" id="logoClear" class="danger">إزالة اللوجو</button>':''}<div><label for="idleMin">شاشة الانتظار بعد كام دقيقة (٠ = إيقاف)</label><input id="idleMin" type="number" min="0" max="120" step="1" value="${(db.branding||{}).idleMinutes??3}"></div><button type="button" id="brandSave" class="primary">حفظ</button></div></section><section class="panel"><h2>الإيصال المطبوع</h2><p class="muted">الإيصال على شكل إيصالات المطاعم: اسم المطعم، رقم الطلب في إطار، جدول الأصناف، الإجمالي، طرق الدفع، وتحته رمز QR فيه تفاصيل الطلب يتعمله سكان بالموبايل. سطر الضريبة بيبيّن القيمة المضمنة في الإجمالي بالنسبة اللي تحددها وبيتطبع فقط لو فعّلته. الإيصال والرمز سجل داخلي للاطلاع، مش إيصال ضريبي إلكتروني رسمي من مصلحة الضرائب.</p><form id="receiptForm" class="formgrid"><div><label for="rcName">اسم المطعم على الإيصال</label><input id="rcName" maxlength="60" value="${esc((db.receipt||{}).name||'')}"></div><div><label for="rcSubtitle">سطر فرعي تحت الاسم (اختياري)</label><input id="rcSubtitle" maxlength="60" value="${esc((db.receipt||{}).subtitle||'')}"></div><div class="wide"><label for="rcBranch">الفرع / العنوان (اختياري)</label><input id="rcBranch" maxlength="120" value="${esc((db.receipt||{}).branch||'')}"></div><div class="checkrow wide"><input type="checkbox" id="rcTaxOn" ${(db.receipt||{}).taxEnabled?'checked':''}><label for="rcTaxOn">المطعم مسجل ضريبيًا: أظهر سطر الضريبة ووصف الفاتورة على الإيصال</label></div><div><label for="rcTaxRate">نسبة الضريبة %</label><input id="rcTaxRate" type="number" min="0" max="100" step="0.01" value="${(db.receipt||{}).taxRate??0}"></div><div><label for="rcTaxLabel">وصف أعلى الإيصال</label><input id="rcTaxLabel" maxlength="60" value="${esc((db.receipt||{}).taxLabel||'Simplified Tax Invoice')}"></div><button class="primary">حفظ إعدادات الإيصال</button></form></section></div>`;$('#userForm').onsubmit=async e=>{e.preventDefault();const name=$('#newUsername').value.trim(),p=$('#newPassword').value,role=$('#newRole').value;if(!name||db.users.some(u=>u.username===name)){$('#userError').textContent='اختار اسم مستخدم مختلف.';return}e.submitter.disabled=true;const u=await newUser(name,p,role);if(save(()=>{db.users.push(u);log('إضافة يوزر',`${name} • ${ROLES[role]}`)}))render()};$$('[data-toggle]').forEach(b=>b.onclick=()=>{save(()=>{const u=db.users.find(u=>u.id===b.dataset.toggle);u.active=!u.active;log('تغيير حالة يوزر',u.username+' • '+u.active)});render()});$$('[data-reset]').forEach(b=>b.onclick=()=>{const u=db.users.find(u=>u.id===b.dataset.reset);modal(`<h2>تغيير باسورد ${esc(u.username)}</h2><form id="resetPasswordForm"><label>باسورد جديد</label><input id="resetPassword" type="password" minlength="6" required autocomplete="new-password"><div class="actions"><button class="primary">حفظ</button><button type="button" id="cancelModal">رجوع</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#resetPasswordForm').onsubmit=async e=>{e.preventDefault();const n=await newUser(u.username,$('#resetPassword').value,u.role);if(save(()=>{u.hash=n.hash;u.salt=n.salt;log('تغيير باسورد',u.username)})){closeModal();toast('اتغير الباسورد')}}});const sched=()=>$$('[data-schedule]').forEach(e=>e.classList.toggle('hidden',Number(e.dataset.schedule)>=Number($('#shiftCount').value)));$('#shiftCount').onchange=sched;sched();$('#scheduleForm').onsubmit=e=>{e.preventDefault();const n=Number($('#shiftCount').value),s=Array.from({length:n},(_,i)=>({name:$('#sName'+i).value.trim(),start:$('#sTime'+i).value}));if(s.some(x=>!x.name||!x.start)||new Set(s.map(x=>x.name)).size!==n||new Set(s.map(x=>x.start)).size!==n){alert('كل شيفت محتاج اسم ووقت مختلفين.');return}if(save(()=>{db.schedule=s;log('تعديل مواعيد الشيفتات',s.map(x=>x.name+' '+x.start).join(' • '))}))toast('اتحفظ الجدول')};$('#receiptForm').onsubmit=e=>{e.preventDefault();const name=$('#rcName').value.trim(),subtitle=$('#rcSubtitle').value.trim(),branch=$('#rcBranch').value.trim(),taxEnabled=$('#rcTaxOn').checked,taxRate=Number($('#rcTaxRate').value),taxLabel=$('#rcTaxLabel').value.trim();if(!Number.isFinite(taxRate)||taxRate<0||taxRate>100){alert('نسبة الضريبة لازم تكون رقم بين ٠ و ١٠٠.');return}if(taxEnabled&&(!taxRate||!taxLabel)){alert('لتفعيل الضريبة اكتب النسبة ووصف الفاتورة.');return}if(save(()=>{db.receipt={name,subtitle,branch,taxEnabled,taxRate,taxLabel};log('إعدادات الإيصال',`${name||'بدون اسم'} • ضريبة ${taxEnabled?taxRate+'%':'مقفولة'}`)})){toast('اتحفظت إعدادات الإيصال');applyBrand()}};$('#logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('الصورة كبيرة. اختار أقل من ٥ ميجا.');return}logoFromFile(f,d=>{if(d.length>500000){alert('اللوجو كبير بعد التصغير. استخدم صورة أبسط.');return}if(save(()=>{db.branding.logo=d;log('تغيير اللوجو','')}))render()})};if($('#logoClear'))$('#logoClear').onclick=()=>{if(save(()=>{db.branding.logo='';log('إزالة اللوجو','')}))render()};$('#brandSave').onclick=()=>{const m=Number($('#idleMin').value);if(!Number.isInteger(m)||m<0||m>120){alert('اكتب رقم صحيح بين ٠ و ١٢٠.');return}if(save(()=>{db.branding.idleMinutes=m;log('شاشة الانتظار',m?m+' دقيقة':'متوقفة')}))toast('اتحفظ')};}
function menuView(v){const it=user.role==='it',cs=db.categories,cnt=id=>db.menu.filter(i=>i.id&&i.catId===id).length;
const catOpts=sel=>cs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.icon)} ${esc(c.name)}${c.active?'':' (موقوف)'}</option>`).join('');
v.innerHTML=`<div class="layout"><section class="panel"><h2>التصنيفات</h2><p class="muted">ارفع صورة لكل تصنيف وكل صنف وهتظهر كمربعات صور في البيع (من غير صورة بيظهر الأيقونة واللون). كل تصنيف بيظهر في شاشة البيع كأيقونة ثابتة، والكاشير يدوس عليها عشان يشوف أصنافها. التصنيف الموقوف بيختفي من البيع بأصنافه، وتقدر تفعّله تاني في أي وقت.</p><form id="catForm" class="formgrid"><input type="hidden" id="catEditId"><div><label for="catName">اسم التصنيف</label><input id="catName" required maxlength="40"></div><div><label for="catIcon">الأيقونة</label><select id="catIcon">${ICONS.map(i=>`<option>${i}</option>`).join('')}</select></div><div><label for="catColor">اللون</label><input id="catColor" type="color" value="#147c80"></div><div class="actions" style="align-self:end"><button class="primary" id="catSave">إضافة تصنيف</button><button type="button" id="catCancel">إلغاء التعديل</button></div></form>${cs.map((c,n)=>`<div class="cartline row wraprow ${c.active?'':'dim'}"><div class="catrow"><span class="caticon${c.photo?' hasph':''}" style="background-color:${c.color};color:${ink(c.color)};${phStyle(c.photo)}">${c.photo?'':esc(c.icon)}</span><div><strong>${esc(c.name)}</strong><br><small>${num(cnt(c.id))} صنف • ${c.active?'مفعّل':'موقوف'}</small></div></div><div class="actions"><button data-up="${c.id}" ${n===0?'disabled':''} aria-label="لأعلى">▲</button><button data-down="${c.id}" ${n===cs.length-1?'disabled':''} aria-label="لأسفل">▼</button><label class="fbtn">📷 ${c.photo?'غيّر الصورة':'صورة'}<input type="file" accept="image/*" hidden data-catphoto="${c.id}"></label>${c.photo?`<button data-catphotodel="${c.id}">شيل الصورة</button>`:''}<button data-catedit="${c.id}">تعديل</button><button data-cattoggle="${c.id}">${c.active?'إيقاف':'تفعيل'}</button>${it?`<button class="danger" data-catdel="${c.id}">حذف</button>`:''}</div></div>`).join('')||'<p class="muted">لسه مفيش تصنيفات. ضيف أول تصنيف من النموذج فوق.</p>'}</section><section class="panel"><h2>الأصناف</h2><p class="muted">${it?'أي تي يضيف الصنف ويحدد سعره وتصنيفه، ويعدّل أو يحذف. السعر مقفول للكاشير.':'المدير يقدر ينقل أي صنف لتصنيف تاني. إضافة الأصناف وتغيير الأسعار من أي تي فقط.'} التغيير للطلبات الجديدة، والقديمة تحتفظ بأسعارها.</p>${it?`<form id="menuForm" class="formgrid"><input type="hidden" id="editId"><div><label for="itemName">اسم الصنف</label><input id="itemName" required maxlength="80"></div><div><label for="itemPrice">السعر بالجنيه</label><input id="itemPrice" required type="number" min="0.01" step="0.01"></div><div class="wide"><label for="itemCat">التصنيف</label><select id="itemCat" required>${catOpts(cs[0]?.id)}</select></div><button class="primary">حفظ الصنف</button><button type="button" id="cancelEdit">إلغاء التعديل</button></form>${cs.length?'':'<p class="error">ضيف تصنيف الأول قبل إضافة الأصناف.</p>'}`:''}${cs.map(c=>{const items=db.menu.filter(i=>i.catId===c.id);return `<h3 style="margin-top:16px">${esc(c.icon)} ${esc(c.name)}${c.active?'':' <small>(موقوف)</small>'}</h3>${items.map(i=>`<div class="cartline row wraprow"><span class="catrow"><span class="thumb" style="${phStyle(i.photo)}">${i.photo?'':'📷'}</span><span>${esc(i.name)}<bdi class="price"> ${money(i.price)}</bdi>${optsOf(i).length?`<br><small>${optsOf(i).map(o=>(o.kind==='combo'?'🎁 ':'')+esc(o.name)+' '+money(o.price)).join(' • ')}</small>`:''}</span></span><div class="actions"><label class="fbtn">📷 ${i.photo?'غيّر':'صورة'}<input type="file" accept="image/*" hidden data-itemphoto="${i.id}"></label>${i.photo?`<button data-itemphotodel="${i.id}">شيل الصورة</button>`:''}<button data-opts="${i.id}">اختيارات وكومبو (${num(optsOf(i).length)})</button><select data-move="${i.id}" aria-label="نقل لتصنيف">${catOpts(i.catId)}</select>${it?`<button data-edit="${i.id}">تعديل</button><button class="danger" data-delete="${i.id}">حذف</button>`:''}</div></div>`).join('')||'<p class="muted">فاضي</p>'}`}).join('')}</section></div>`;
const reset=()=>{$('#catForm').reset();$('#catEditId').value='';$('#catColor').value='#147c80';$('#catSave').textContent='إضافة تصنيف'};$('#catCancel').onclick=reset;
$('#catForm').onsubmit=e=>{e.preventDefault();const name=$('#catName').value.trim(),icon=$('#catIcon').value,color=$('#catColor').value,id=$('#catEditId').value;if(!name||!/^#[0-9a-fA-F]{6}$/.test(color))return;if(cs.some(c=>c.id!==id&&c.name===name)){alert('فيه تصنيف بنفس الاسم. اختار اسم مختلف.');return}if(save(()=>{const c=db.categories.find(c=>c.id===id);if(c){Object.assign(c,{name,icon,color});log('تعديل تصنيف',name)}else{db.categories.push({id:uid(),name,icon,color,active:true});log('إضافة تصنيف',name)}}))render()};

$$('[data-move]').forEach(sel=>sel.onchange=()=>{if(save(()=>{const i=db.menu.find(i=>i.id===sel.dataset.move);i.catId=sel.value;log('نقل صنف لتصنيف',i.name+' ← '+catOf(sel.value).name)})){toast('اتنقل الصنف');render()}});
const setPhoto=(kind,id,f)=>photoFromFile(f,d=>{if(save(()=>{const o=kind==='cat'?db.categories.find(c=>c.id===id):db.menu.find(i=>i.id===id);if(!photoOk(d))throw Error();o.photo=d;log('صورة '+(kind==='cat'?'تصنيف':'صنف'),o.name)})){toast('اتحفظت الصورة');render()}},kind==='cat'?300:256),delPhoto=(kind,id)=>{if(save(()=>{const o=kind==='cat'?db.categories.find(c=>c.id===id):db.menu.find(i=>i.id===id);delete o.photo;log('شيل صورة',o.name)}))render()};$$('[data-catphoto]').forEach(el=>el.onchange=()=>el.files[0]&&setPhoto('cat',el.dataset.catphoto,el.files[0]));$$('[data-itemphoto]').forEach(el=>el.onchange=()=>el.files[0]&&setPhoto('item',el.dataset.itemphoto,el.files[0]));$$('[data-catphotodel]').forEach(b=>b.onclick=()=>delPhoto('cat',b.dataset.catphotodel));$$('[data-itemphotodel]').forEach(b=>b.onclick=()=>delPhoto('item',b.dataset.itemphotodel));$$('[data-opts]').forEach(b=>b.onclick=()=>optionsDialog(b.dataset.opts));
if(it){$('#cancelEdit').onclick=()=>$('#menuForm').reset()||($('#editId').value='');$('#menuForm').onsubmit=e=>{e.preventDefault();if(db.draft.items.length){alert('خلّص أو فرّغ المسودة الأول.');return}if(!cs.length){alert('ضيف تصنيف الأول.');return}const name=$('#itemName').value.trim(),price=cents($('#itemPrice').value),id=$('#editId').value,catId=$('#itemCat').value;if(!name||!price||!catOf(catId))return;if(save(()=>{const i=db.menu.find(i=>i.id===id);if(i)Object.assign(i,{name,price,catId});else db.menu.push({id:uid(),name,price,catId});log('تعديل منيو',`${name} • ${money(price)} • ${catOf(catId).name}`)}))render()};$$('[data-edit]').forEach(b=>b.onclick=()=>{const i=db.menu.find(x=>x.id===b.dataset.edit);$('#editId').value=i.id;$('#itemName').value=i.name;$('#itemPrice').value=(i.price/100).toFixed(2);$('#itemCat').value=i.catId;$('#itemName').focus()});$$('[data-delete]').forEach(b=>b.onclick=()=>{if(db.draft.items.length){alert('خلّص المسودة الأول');return}if(confirm('حذف الصنف من المنيو؟ الطلبات القديمة هتفضل محفوظة.')){save(()=>{const i=db.menu.find(x=>x.id===b.dataset.delete);log('إيقاف صنف',i.name);db.menu=db.menu.filter(i=>i.id!==b.dataset.delete)});render()}})}}

function auditView(v){v.innerHTML=`<section class="panel"><h2>سجل الرقابة</h2><p class="muted">الخصومات والحذف والتقفيل والإعدادات باسم اليوزر. السجل محلي وليس مقاومًا للتلاعب خارج واجهة البرنامج.</p>${db.audit.slice().reverse().map(a=>`<div class="log"><strong>${esc(a.action)} • ${esc(a.actor)}</strong><div class="muted compact">${new Date(a.at).toLocaleString('ar-EG')} • ${esc(ROLES[a.role]||a.role)}</div><p>${esc(a.details)}</p></div>`).join('')||'<p>مفيش أحداث</p>'}</section>`}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function migrateV1(x){if(x.version!==1||!Array.isArray(x.days)||!Array.isArray(x.menu)||!x.draft)throw Error();let n=fresh(mode);n.users=db.users;n.menu=x.menu;delete n.categories;delete n.branding;n.nextOrder=x.nextOrder;n.nextVisa=x.nextVisa;n.days=x.days.map(d=>({...d,expenses:[],shifts:[],orders:d.orders.map(o=>({...blank(),...o,customer:{name:'',phone:'',address:'',area:''},appRef:'',ownDelivery:false,discount:0,approval:null,cardType:o.card?'فيزا أخرى':null,commission:0,commissionRate:0,voided:false,cashier:'نسخة ١',shiftId:null}))}));n.draft={...blank(),...x.draft,customer:{name:'',phone:'',address:'',area:''}};n.audit=[{at:now(),actor:user.username,role:user.role,action:'استيراد نسخة ١',details:'الأوردرات القديمة بدون بيانات عملاء أو عمولات، لم يتم تخمينها'}];return n}
function helpView(v){const admin=user?.role==='it';v.innerHTML=`<div class="layout"><section class="panel"><h2>التشغيل وحدود النسخة</h2><p>ملف HTML واحد بيشتغل بدون إنترنت. نزّله وافتحه بمتصفح حديث، مش عارض النصوص. لو واتساب حوّله TXT، غيّر الامتداد إلى HTML من الملفات أو من كمبيوتر الشغل. حافظ على نفس اسم ومكان الملف والمتصفح.</p><p>ابدأ بالتجربة: أي تي ينشئ يوزر لكل موظف ويظبط المنيو والشيفتات. المحاسب يضبط عمولات التطبيقات. الكاشير يفتح شيفت، يسجل العميل والطلب ويحصّل. المدير يوافق على الخصومات، يجرد، ويعمل تشيك أوت للموظف ويقفل اليوم.</p><p>لكل نوع فيزا ملخص مستقل، ومع أي مبلغ فيزا فيه مسلسل داخلي مستمر بين الأيام. ده مش مسلسل البنك. طابقه مع ماكينة الدفع وتسويات التطبيقات يدويًا.</p><p>الطباعة بتقفل الحذف للكاشير. بعد التحصيل المدير يقدر يلغي أوردر كامل مع تسجيل المردود والسبب، قبل قفل شيفته أو اليوم. مفيش حذف صامت، ولا مرتجع جزئي بعد التحصيل في النسخة دي. رد المال الحقيقي لازم يتم خارج البرنامج.</p><p>كل التكاليف والعمولات يدوية. الصافي بعد العمولة مش صافي الربح. النتيجة بعد التكاليف تقديرية وتتوقف على اكتمال التسجيل. لا ربط بطلبات أو منيوز أو البنك أو الطابعة الحرارية أو الضرائب، والطباعة من المتصفح فقط.</p><div class="warn">ده نموذج اختبار على جهاز واحد، مش POS إنتاجي معتمد. الصلاحيات وكلمات المرور تنظّم الاستخدام المحلي، لكنها لا تمنع شخصًا يقرأ الكود أو يعدّل التخزين. مفيش سيرفر أو مزامنة أو سجل مقاوم للتلاعب. لا تعتمد عليه وحده في شغل حقيقي أو تسلمه لعميل كنظام آمن.</div><p>بيانات العملاء والنسخ الاحتياطية غير مشفرة. حافظ على خصوصيتها، لا تشارك نسخة الشغل مع غير المصرح لهم. كلمات المرور مخزنة كقيم تحقق مملحة وليست كنص صريح.</p><p>اختبر الحفظ بعد القفل وإعادة الفتح والطباعة والنسخ على جهاز الشغل. التخزين المحلي قد يتغير حسب المتصفح، وممكن يتشال بمسح بيانات المتصفح أو التصفح الخفي. نزّل نسخة JSON كل يوم وانقلها لمكان آمن. استرجاع النسخة استبدال كامل مش دمج، وممكن يحتاج تسجيل دخول من جديد.</p></section><section class="panel stack"><h2>النسخ ووضع التشغيل</h2>${!user?'<button id="backLogin">رجوع للدخول</button>':''}<button id="switchMode">${mode==='demo'?'الانتقال لبيانات الشغل':'فتح وضع التجربة'}</button><p class="muted">كل وضع منفصل ببياناته ويوزراته. أول استخدام لكل وضع يبدأ بإنشاء حساب أي تي.</p>${admin||!user&&loadProblem?'<button id="backup" class="primary">تنزيل نسخة احتياطية JSON</button>':'<p class="muted">التصدير الكامل والاسترجاع لأي تي فقط لحماية بيانات الحسابات والعملاء.</p>'}${admin?'<label for="restoreFile">استرجاع نسخة v2 أو نسخة v1 لنفس الوضع</label><input type="file" id="restoreFile" accept=".json,application/json"><button id="restore">استرجاع واستبدال البيانات</button><p class="muted">استيراد v1 يحتفظ بيوزرات v2 الحالية. العمولات القديمة تظل صفرًا لعدم وجودها في النسخة الأولى. صدّر نسخة قبل الاستيراد.</p>':''}</section></div>`;if($('#backLogin'))$('#backLogin').onclick=render;$('#switchMode').onclick=()=>{if(confirm('تبديل الوضع وتسجيل خروج؟ البيانات مش هتتمسح.')){try{localStorage.setItem(META,mode==='demo'?'real':'demo');location.reload()}catch(e){alert('التخزين غير متاح')}}};if($('#backup'))$('#backup').onclick=()=>{try{const raw=loadProblem?localStorage.getItem(KEY+mode):JSON.stringify(db,null,2);if(!raw){alert('مفيش بيانات محفوظة');return}download(raw,`دفتر-الكاشير-v2-${mode}-${today()}.json`,'application/json')}catch(e){alert('تعذر التصدير')}};if($('#restore'))$('#restore').onclick=async()=>{const f=$('#restoreFile').files[0];if(!f||f.size>20*1024*1024){alert('اختار نسخة JSON أقل من ٢٠ ميجابايت');return}try{let x=JSON.parse(await f.text());if(x.mode!==mode)throw Error();if(x.version===1)x=migrateV1(x);x=normalize(x);if(!validDB(x))throw Error();x.receipt={...RECEIPT_DEFAULTS,...x.receipt};if(!confirm('نزّلت نسخة حالية؟ كل بيانات الوضع الحالي هتتستبدل بالنسخة المختارة.'))return;localStorage.setItem(KEY+mode,JSON.stringify(x));location.reload()}catch(e){alert('تعذر الاسترجاع. الملف غير صالح أو لوضع تشغيل مختلف. لم يتم تغيير البيانات.')}}}
window.addEventListener('storage',e=>{if(e.key===KEY+mode||e.key===META){alert('البيانات اتغيرت من نافذة تانية، هنعيد التحميل لمنع تكرار العمليات.');location.reload()}});
